networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:

services:
  # --- BACKEND (Laravel 12) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobpulse-backend-1
    volumes:
      - ./backend:/var/www
    env_file:
      - ./backend/.env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
    networks:
      - app-network

  # --- LARAVEL QUEUE WORKER ---
  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobpulse-queue-worker
    restart: unless-stopped
    command: >
      php artisan queue:work redis
      --queue=recommendations,default
      --sleep=3
      --tries=3
      --timeout=120
      --verbose
    depends_on:
      - redis
      - postgres

  # --- FRONTEND (React + TS + Tailwind) ---
  frontend:
    build:
      context: ./frontend
    container_name: jobpulse-frontend-1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - CHOKIDAR_USECHIKIDAR=true 
    networks:
      - app-network

  # --- SCRAPERS (Python + Playwright + BS4) ---
  scrapers:
    build:
      context: ./scrapers
    container_name: jobpulse-scrapers-1
    volumes:
      - ./scrapers:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - postgres
      - redis
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    networks:
      - app-network

  # --- REVERSE PROXY (Nginx) ---
  nginx:
    image: nginx:alpine
    container_name: jobpulse-nginx-1
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - app-network

  # --- DATABASE (PostgreSQL) ---
  postgres:
    image: postgres:16-alpine
    container_name: jobpulse-postgres-1
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  # --- CACHE & QUEUE (Redis) ---
  redis:
    image: redis:alpine
    container_name: jobpulse-redis-1
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - app-network
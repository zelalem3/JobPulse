services:
  # Your existing Web Service (API)
  - type: web
    name: jobpulse-api
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile # Adjust path if needed
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: jobpulse-db
          property: connectionString

  # Background Worker to run Laravel scheduler automatically
  - type: worker
    name: jobpulse-scheduler
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    autoDeploy: true
    startCommand: "php artisan schedule:work"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: jobpulse-db
          property: connectionString

databases:
  - name: jobpulse-db
    plan: free
    databaseName: jobpulse
    user: jobpulse_user